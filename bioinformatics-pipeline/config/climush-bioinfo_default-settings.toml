# This is the default configuration file for the CliMush bioinformatics pipeline.

title = 'CliMush Bioinformatics Pipeline DEFAULT Configuration'



[globus_info]
climush_endpoint = 'ba6d86af-0b0d-46b7-a56a-bb4ebadec1b9'  # string: the Globus endpoint ID of the CliMush Sequences
                                                           #    group collection

[run_details]
run_name = 'psl2310-2602'  # string: bioinformatics run name that will be used to label directories, etc.


[automate]
run_all =       false  # true/false: when set to 'true', the entire pipeline will run from start to finish automatically
run_some =      []     # integer(s): list of integers corresponding to the steps of the pipeline to run, e.g., [1,2,3]
save_all =      true   # true/false: when set to 'true', will save all logs from the pipeline run; otherwise saves none
exit_on_error = true   # true/false: when set to 'true', automated pipeline will stop if error/warning shown
auto_respond =  true   # true/false: if automated, set to 'true' to respond 'yes' to prompts; otherwise, respond 'no'
verbose =       false  # true/false: will not print out warnings if set to False, if True prints everything


[formatting]
fasta_headers = ['sequence', 'region_len', 'full-len_copies']   # not ammenable to changes currently (2025-04)
header_delim  = ';'                                             # string; delimiter to use to separate information in
                                                                #   the sequence file read headers
filename_delim = '_'                                            # string; delimiter to use to separate file name labels
                                                                #   in the sequence file names

[demultiplex]
multiplex.7803 = 'pacbio_soil-litter_2023-10'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.6971 = 'pacbio_sporocarp-f_2023-03'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.7668 = 'pacbio_sporocarp-f_2023-11'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.7806 = 'pacbio_sporocarp-f_2023-12'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.7983 = 'pacbio_sporocarp-f_2024-01'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.8007 = 'pacbio_sporocarp-f_2024-03'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.8126 = 'pacbio_sporocarp-f_2024-04'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.8304 = 'pacbio_sporocarp-f_2024-06'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.8545 = 'pacbio_sporocarp-f_2024-10'  # 4-digit UO sequencing core needed to find multiplexed files
multiplex.8923 = 'pacbio_sporocarp-f_2025-02'  # 4-digit UO sequencing core needed to find multiplexed files

min_precision =  { 'fwd' = 93, 'rev' = 93 }    # integer [0 through 100, inclusive]: barcode precision minimum
                                               #    score (93 = 93%); 93 recommended by Tedersoo et al. 2021

[primers]
fwd.pacbio =   { 'ITS1catta' = 'ACCWGCGGARGGATCATTA' }  # key/value strings: primer name is key, primer sequence is value
fwd.illumina = { 'ITS1F' = 'CTTGGTCATTTAGAGGAAGTAA' }
fwd.sanger =   { 'ITS1F' = 'CTTGGTCATTTAGAGGAAGTAA' }   # key/value strings: primer name is key, primer sequence is value

rev.pacbio =   { 'LR5' = 'TCCTGAGGGAAACTTCG' }          # key/value strings: primer name is key, primer sequence is value
rev.illumina = { 'ITS2' = 'GCTGCGTTCTTCATCGATGC' }      # key/value strings: primer name is key, primer sequence is value
rev.sanger =   { 'ITS4' = 'TCCTCCGCTTATTGATATGC' }      # key/value strings: primer name is key, primer sequence is value

[adapters]
fwd.illumina = { 'truseq' = 'AGATCGGAAGAGCACACGTCTGAACTCCAGTCA' }  # key/value strings: adapter name is key, adapter trim sequence is value
rev.illumina = { 'truseq' = 'AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT' }  # key/value strings: adapter name is key, adapter trim sequence is value

[remove_primers]
max_error_rate =   { 'fwd' = 0.2, 'rev' = 0.2 }    # float: maximum error rate used by cutadapt for fwd and rev primer match
linked_adapters =  true                            # true/false: if true, primers are linked (e.g., read must have fwd + rev)
require_adapters = { 'fwd' = true, 'rev' = true }  # true/false: if true, fwd/rev primer is required in order to trim
keep_untrimmed =   true                            # true/false: save untrimmed reads to an untrimmed folder
max_untrimmed =    10                              # integer: the maximum allowed percentage of total reads to remain
                                                   #          untrimmed (10 = 10% of total input reads not trimmed)


[quality_filtering]
prefilter.phix_kmer        = 31 # integer [max=31]; kmer to use when searching sequences for PhiX spike-in to filter
prefilter.phix_hammingdist = 1  # integer; hamming distance to use when searching sequences for PhiX spike-in to filter
prefilter.maxn             = 0  # integer; maximum number of ambiguous base calls (N) allowed to pass prefiltering

min_qscore.illumina = 0  # integer: the minimum quality score allowed for illumina reads
min_qscore.sanger   = 0  # integer: the minimum quality score allowed for sanger reads
min_qscore.pacbio   = 40 # integer: the minimum required quality score to use as a filter of PacBio ITS-LSU reads

max_qscore.illumina = 41  # integer: the maximum quality score allowed for illumina reads to pass prefiltering
max_qscore.sanger   = 41  # integer: the maximum quality score allowed for sanger reads to pass prefiltering
max_qscore.pacbio   = 50  # integer: the maximum quality score allowed for pacbio ITS-LSU reads

min_len.sanger   = 100  # integer: minimum sequence length (bp) of post-primer removal reads
min_len.illumina = 100  # integer: minimum sequence length (bp) of post-primer removal reads
min_len.pacbio   = 100  # integer: minimum sequence length (bp) of post-primer removal reads

max_len.sanger   = 800   # integer: maximum sequence length (bp) of post-primer removal reads
max_len.illumina = 500   # integer: maximum sequence length (bp) of post-primer removal reads
max_len.pacbio   = 8000  # integer: maximum sequence length (bp) of post-primer removal reads

max_error.sanger   = 1.0  # float: maximum expected error
max_error.illumina = 1.0  # float: maximum expected error

merge_reads.illumina = true  # true/false: if true, all forward and reverse reads will be merged


[dereplicate]
min_count.derep01.sanger   = 1  # integer: minimum number of identical full-length reads (or %); must be at least 1
min_count.derep01.illumina = 1  # integer: minimum number of identical full-length reads (or %); must be at least 1
min_count.derep01.pacbio   = 1  # integer: minimum number of identical full-length reads (or %); must be at least 1

min_count.derep02.sanger   = 1  # integer: minimum number of identical full-length reads (or %); must be at least 1
min_count.derep02.illumina = 1  # integer: minimum number of identical full-length reads (or %); must be at least 1
min_count.derep02.pacbio   = 5  # integer: minimum number of identical reads after derep of subregion reads (or %)


[separate_subregions]
fungi_only    = true   # true/false (optional): if true, compares only to fungi reference sequences; if false, searches all (time-consuming)
which_regions = 'all'  # SSU, ITS1, 5.8S, ITS2, LSU, all (default), none (optional): region or subregion to output


[denoise]
minsize =         8         # integer: minimum read abundance of a sequence required to pass denoising
alpha =           2.0       # float: minimum abundance skew; factor by which read abundance of centroid exceeds read (?)
clust_threshold = 0.98      # float [between 0.0 and 1.0, inclusive]; minimum pairwise alignment identity to cluster
                            #   to a centroid sequence

[chimera_check]
method =          'denovo'                               # 'reference'/'denovo': whether to use uchime denovo or
                                                         #   reference-based using UNITE's chim ref dataset
keep_chimeras =   true                                   # true/false: keep reads that are chimeras, separated into a
                                                         #   directory of chimeras
alpha.reference = 2.0                                    # float: minimum abundance skew; factor by which read abundance
                                                         #   of centroid exceeds chimera
alpha.denovo = { 'denoised' = 16.0, 'undenoised' = 2.0 } # float: minimum abundance skew; factor by which read abundance
                                                         #   of centroid exceeds chimera

[otu_clustering]
min_threshold = 0.98         # float [between 0.0 and 1.0, inclusive]: minimum percent identity to cluster reads into OTUs
method =        2            # integer [0, 1, 2 (default), 3, 4]; method for calculating pairwise identity with vsearch,
                             #    with the default using edit distance excluding terminal gaps; see the vsearch
                             #    documentation for a description of each option
group_by =      'community'  # string ['community', 'sample']: what pool of reads to consider when clustering
choose_rep_by = ''           # string: how to chose the representative read for each OTU, options = '', 'read count',
                             #    'read length'; if empty string is used (''), will use standard protocol to chose
choose_top_by = ''           # string: how to chose the top OTU per sample; options = '', 'read count',
                             #    'read length'; if empty string is used (''), will use standard protocol to chose;
                             #    only relevant for pacbio sporocarp sequences
separate_clusters = false    # true/false: whether to write out clusters to their own .fasta file

[taxonomy]
method = 'amptk'    # method/tool used to assign taxonomy to the OTUs